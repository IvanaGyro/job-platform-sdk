[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-platform-sdk"
version = "0.1.0a1"
description = "Unofficial multi-platform job application and resume SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["patchright>=1.61.2,<2"]

[project.optional-dependencies]
http = ["fastapi>=0.115", "uvicorn>=0.30"]
curl = ["curl_cffi>=0.17,<0.18"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
job-platform = "job_platforms.cli:main"
job-platform-server = "job_platforms.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["job_platforms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
